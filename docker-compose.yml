version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virallens-support-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROuter_API_KEY}
      - AI_MODEL=${AI_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      - NODE_ENV=production
    restart: always
